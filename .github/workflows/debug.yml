name: Отладка вёрстки

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Адреса страниц через пробел"
        required: true

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scraper.debug ${{ inputs.urls }}
      - name: Сохранить в ветку debug-dump
        run: |
          cd debug
          git init -q -b debug-dump
          git add -A
          git -c user.name=price-bot -c user.email=price-bot@users.noreply.github.com commit -qm "debug dump"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug-dump
