name: Отладка вёрстки

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Адреса страниц через пробел"
        required: true

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scraper.debug $URLS
        env:
          URLS: ${{ inputs.urls }}
