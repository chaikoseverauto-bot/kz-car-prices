name: Ежедневный сбор цен

on:
  schedule:
    - cron: "0 3 * * *"   # около 08:00–09:00 по времени Казахстана
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m scraper.run
      - name: Сохранить данные
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Цены на $(date -u +%F)"
            git push
          fi
      - name: Отчёт в сводку запуска
        if: always()
        run: cat data/changes.md >> "$GITHUB_STEP_SUMMARY" || true
